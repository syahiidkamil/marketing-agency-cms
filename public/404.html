<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan · rakit.</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #16161F; color: #F4F3EF;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(ellipse 50% 40% at 50% 40%, rgba(248, 187, 61, .12), transparent 70%);
    }
    main { max-width: 560px; text-align: center; }
    .logo { font-weight: 900; font-size: 28px; letter-spacing: -.04em; color: inherit; text-decoration: none; }
    .logo span, .gold { color: #F8BB3D; }
    .code { margin: 40px 0 8px; font: 500 13px ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #8A899A; }
    h1 { margin: 0; font-weight: 900; font-size: clamp(44px, 9vw, 84px); line-height: .95; letter-spacing: -.055em; }
    p { margin: 20px auto 0; max-width: 420px; color: #B7B6C2; font-size: 17px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; }
    .actions a { padding: 16px 26px; border-radius: 999px; font-weight: 800; font-size: 16px; text-decoration: none; }
    .primary { background: #F8BB3D; color: #16161F; }
    .primary:hover { background: #FFC857; }
    .ghost { border: 1px solid #3A3A52; color: #F4F3EF; }
    .ghost:hover { border-color: #F4F3EF; }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">rakit<span>.</span></a>
    <p class="code">ERROR 404</p>
    <h1>Halaman ini <span class="gold">nggak ketemu.</span></h1>
    <p>Mungkin link-nya salah ketik atau halamannya sudah dipindah. Omzet kamu masih bisa kami bantu cari, kok.</p>
    <div class="actions">
      <a class="primary" href="/">Kembali ke beranda</a>
      <a class="ghost" href="/#kontak">Jadwalkan call</a>
    </div>
  </main>
</body>
</html>
